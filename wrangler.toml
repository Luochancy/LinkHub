name = "linkhub"
main = "src/server/worker.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
# 保留 Cloudflare Dashboard 中配置的变量和 Secrets。
keep_vars = true

[[routes]]
pattern = "linkhub.luochancy.com"
custom_domain = true

[assets]
directory = "public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "LINKS_KV"
id = "d77e8fd888de414c891b9e1df3c9609a"

# 运行时变量和 Secrets 全部在 Cloudflare Dashboard 中维护。
# 请勿在此添加 [vars]：同名配置会在部署时覆盖 Dashboard 中已有的值。
